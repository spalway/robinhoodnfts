[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Belt and braces: every money path already uses checked_* explicitly, but a
# release build with overflow-checks off would silently wrap anything that was
# missed. The extra compute is worth far less than a wrapped balance.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
