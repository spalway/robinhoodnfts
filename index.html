<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Middot, not an em dash. The tab is the one place the title competes with
         a dozen others at ~15 characters before it truncates, and an em dash
         eats width that could be showing the second half of the phrase. It is
         also the separator the interface already uses everywhere else. -->
    <title>xCorp · hire an xployee</title>
    <meta
      name="description"
      content="xCorp · generative pixel xployees whose skills work xStocks desks on Robinhood Chain. Hire, contract, or trade them."
    />

    <!-- Favicon. SVG first for anything modern — it stays crisp at every tab and
         bookmark size, which a raster icon does not. The 32px PNG is the fallback
         Safari needs, since it ignores SVG favicons entirely. Generated by
         `npm run brand`; edit scripts/brand.mjs, not these files. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
