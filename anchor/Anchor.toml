[toolchain]
# Pinned because the IDL format changed in 0.30 and the TypeScript client in
# tests/ reads the 0.30+ shape. A CLI older than this produces an IDL the tests
# cannot decode events from.
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
xnft_market = "7bPUjqHijBsh5XHEXq2FbbVURSFoA5moMGM2MQREXpsW"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[test.validator]
# 32 slots — the protocol minimum, about thirteen seconds — instead of the
# default 432,000. Rental terms are measured in epochs, so on the default epoch
# length the clock never leaves epoch 0 and nothing that expires can be tested:
# `close_contract` after expiry, and `cancel_listing` unblocking when a term runs
# out, would both be unreachable.
slots_per_epoch = 32

[scripts]
# npx rather than yarn: the repo is npm-managed, and anchor's default `yarn run`
# fails on a workspace that has no yarn lockfile.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
